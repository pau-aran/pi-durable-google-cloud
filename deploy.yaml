# Edit exactly two values before you apply this file: the image and the domain.
# Each one is marked with "# EDIT".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pi-durable
spec:
  # Keep 1. Each pod gets its own disk, and nothing routes a session to its pod.
  replicas: 1
  serviceName: pi-durable
  selector:
    matchLabels:
      app: pi-durable
  template:
    metadata:
      labels:
        app: pi-durable
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/PROJECT/pi-durable/app # EDIT
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pi-durable
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "pi-durable"}'
spec:
  selector:
    app: pi-durable
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pi-durable
spec:
  # The default of 30 s is the longest life of a WebSocket through the load balancer.
  timeoutSec: 86400
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: pi-durable
spec:
  domains:
    - chat.example.com # EDIT
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-durable
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: pi-durable
spec:
  defaultBackend:
    service:
      name: pi-durable
      port:
        number: 8080
